[project]
name = "spikegate"
version = "0.1.0"
description = "Real-time fraud-spike detection and bounded agentic response system"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "SpikeGate Team" }]

dependencies = [
    # ML / detection
    "xgboost>=2.0",
    "scikit-learn>=1.4",
    "shap>=0.45",
    # Data
    "pandas>=2.0",
    "numpy>=1.26",
    # Schema / validation
    "pydantic>=2.0",
    # LangGraph agent
    "langgraph>=0.2",
    "langchain-core>=0.2",
    "langchain-google-genai>=1.0",
    "google-generativeai>=0.7",
    # Storage
    "sqlalchemy>=2.0",
    # Dashboard
    "streamlit>=1.35",
    # Config
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
]

[project.scripts]
spikegate-eval = "eval.run_eval:main"
spikegate-dashboard = "dashboard.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "data_gen",
    "detector",
    "agent",
    "eval",
    "dashboard",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short -p no:deepeval"

[tool.coverage.run]
source = ["data_gen", "detector", "agent", "eval"]
omit = ["tests/*", "dashboard/*"]
